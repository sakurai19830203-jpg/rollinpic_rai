<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rollin'pic 2026 | CAPCOM vs SNK 2 World Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@800;900&family=Teko:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --capcom-blue: #00e1ff;
      --snk-red: #ff2a4b;
      --accent-yellow: #ffcc00;
      --bg-black: #060608;
      --panel-bg: #101014;
      --panel-border: #22222c;
      --text: #f0f0f5;
      --text-muted: #888899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(255, 204, 0, 0.05), transparent 60%),
        linear-gradient(180deg, rgba(6, 6, 8, 0.85) 0%, rgba(12, 12, 16, 0.92) 100%),
        url('main_bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.4;
      overflow-x: hidden;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 15px 80px;
    }

    /* Hero Area */
    .hero {
      text-align: center;
      position: relative;
      padding: 10px 0 25px;
      margin-bottom: 35px;
      border-bottom: 1px solid var(--panel-border);
    }

    .main-logo-container {
      position: relative;
      z-index: 1;
      max-width: 580px;
      margin: 0 auto 5px;
    }

    .main-logo-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.95));
    }

    /* 公式ロゴ表示エリア */
    .official-logo-container {
      max-width: 320px;
      margin: 15px auto 10px;
    }

    .official-logo-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
    }

    .world-title-wrap {
      margin-top: 8px;
    }

    .world-main-txt {
      display: inline-block;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      font-weight: 900;
      color: #d5d5e0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 2px;
    }

    /* キャッチフレーズ演出 */
    .hero-catchphrase {
      margin-top: 14px;
      font-size: clamp(1.15rem, 3.2vw, 1.85rem);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-yellow) 50%, #ff8800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
      font-style: italic;
    }

    /* カウントダウンタイマー */
    .countdown-container {
      margin-top: 22px;
      background: rgba(10, 10, 16, 0.7);
      border: 1px solid var(--panel-border);
      border-top: 2px solid var(--accent-yellow);
      display: inline-block;
      padding: 12px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .countdown-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .countdown-timer {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .time-block {
      text-align: center;
    }

    .time-val {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-yellow);
      line-height: 1;
      display: block;
      min-width: 42px;
    }

    .time-unit {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Guide Banner */
    .guide-banner {
      background-color: #000;
      background-image: 
        linear-gradient(110deg, rgba(0, 0, 0, 0.75) 0%, rgba(10, 10, 15, 0.85) 100%),
        url('guide_bg.jpg');
      background-size: cover;
      background-position: center;
      border-left: 8px solid var(--accent-yellow);
      border-right: 1px solid #333;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 24px 25px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      transform: skewX(-6deg);
      box-shadow: 10px 10px 0px #000;
      position: relative;
    }

    .guide-banner-inner {
      transform: skewX(6deg);
    }

    .guide-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 1), 0 0 4px rgba(0, 0, 0, 0.9);
    }

    .guide-desc {
      font-size: 0.88rem;
      color: #d8d8e5;
      margin-top: 4px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 1), 0 0 3px rgba(0, 0, 0, 0.9);
    }

    .btn-guide {
      background: var(--accent-yellow);
      color: #000;
      font-family: 'Teko', sans-serif;
      font-size: 1.6rem;
      padding: 4px 30px;
      text-decoration: none;
      font-weight: 900;
      display: inline-block;
      white-space: nowrap;
      clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
      transition: transform 0.2s, background 0.2s;
      box-shadow: 4px 4px 0px #000;
    }

    .btn-guide:hover {
      transform: scale(1.08) skewX(6deg);
      background: #fff;
    }

    /* Schedule Section Header */
    .block-header {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      line-height: 1;
    }

    .block-header::after {
      content: '';
      flex: 1;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-yellow), transparent);
    }

    /* Schedule Grid & Background Cards */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .event-card {
      background-color: var(--panel-bg);
      background-size: cover;
      background-position: center;
      border: 1px solid var(--panel-border);
      position: relative;
      padding: 28px 20px;
      box-shadow: 8px 8px 0px #000;
      z-index: 1;
    }

    .event-card.capcom-side {
      border-top: 6px solid var(--capcom-blue);
      background-image: 
        linear-gradient(180deg, rgba(16, 16, 20, 0.85) 0%, rgba(10, 10, 14, 0.95) 100%),
        url('day1_bg.jpg');
    }

    .event-card.snk-side {
      border-top: 6px solid var(--snk-red);
      background-image: 
        linear-gradient(180deg, rgba(16, 16, 20, 0.85) 0%, rgba(10, 10, 14, 0.95) 100%),
        url('day2_bg.jpg');
    }

    .event-card.vs-side {
      border-top: 6px solid var(--accent-yellow);
      background-image: 
        linear-gradient(180deg, rgba(16, 16, 20, 0.85) 0%, rgba(10, 10, 14, 0.95) 100%),
        url('day3_bg.jpg');
    }

    .date-badge {
      font-family: 'Teko', sans-serif;
      font-size: 2.2rem;
      line-height: 0.9;
      color: var(--accent-yellow);
      margin-bottom: 8px;
      display: block;
      letter-spacing: 1px;
    }

    .card-heading {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      letter-spacing: 1px;
    }

    /* ルールバナー */
    .rule-banner {
      background: linear-gradient(135deg, rgba(20, 20, 28, 0.95), rgba(5, 5, 10, 0.95));
      border: 1px solid var(--accent-yellow);
      border-left: 5px solid var(--accent-yellow);
      padding: 10px 14px;
      margin-bottom: 16px;
      transform: skewX(-6deg);
      box-shadow: 4px 4px 0px #000;
      text-decoration: none;
      display: block;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .rule-banner-inner {
      transform: skewX(6deg);
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .rule-banner.disabled {
      background: rgba(15, 15, 22, 0.85);
      border: 1px dashed #444455;
      border-left: 5px solid #666677;
      cursor: not-allowed;
      box-shadow: 2px 2px 0px #000;
    }

    .rule-banner.disabled .rule-banner-inner {
      color: #888899;
      font-weight: bold;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      margin-bottom: 20px;
    }

    .info-table td {
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
    }

    .info-table td:first-child { color: var(--text-muted); }
    .info-table td:last-child { text-align: right; font-weight: bold; font-size: 1.05rem; }

    /* エントリーボタン */
    .entry-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--accent-yellow);
      border: 2px solid var(--accent-yellow);
      color: #000;
      font-family: 'Teko', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
      padding: 6px;
      margin-top: 15px;
      transition: all 0.2s;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0px #000;
    }

    .entry-btn:hover {
      background: #fff;
      border-color: #fff;
      color: #000;
      transform: translateY(-2px);
    }

    .entry-btn.disabled {
      background: rgba(15, 15, 20, 0.8);
      border: 1px dashed #444455;
      color: #8
